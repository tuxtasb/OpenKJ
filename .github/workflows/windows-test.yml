name: Windows build test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows Builds
    runs-on: windows-2025
    strategy:
      matrix:
        include:
          - windows-arch: 64
            bits: 64
            arch: x86_64
            msvcarch: x64
            qtarch: win64_msvc2022_64

    steps:
    - uses: actions/checkout@v5

    - uses: seanmiddleditch/gha-setup-ninja@master

    - name: Download GStreamer installer
      uses: carlosperate/download-file-action@v2
      id: download-gst
      with:
        file-url: 'https://gstreamer.freedesktop.org/data/pkg/windows/1.28.8/msvc/gstreamer-1.0-msvc-${{ matrix.arch }}-1.28.8.exe'
        file-name: 'gstreamer-installer.exe'
        location: './downloads'

    - name: Install GStreamer (runtime + development files)
      shell: powershell
      run: |
        Start-Process -Wait -FilePath "${{ steps.download-gst.outputs.file-path }}" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TYPE=full','/DIR=C:\gstreamer\1.0\msvc_${{ matrix.arch }}'
        "GSTREAMER_1_0_ROOT_MSVC_X86_64=C:\gstreamer\1.0\msvc_${{ matrix.arch }}\" | Out-File -FilePath $env:GITHUB_ENV -Append
        "C:\gstreamer\1.0\msvc_${{ matrix.arch }}\bin" | Out-File -FilePath $env:GITHUB_PATH -Append

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
       version: '6.11.2'
       arch: ${{ matrix.qtarch }}
       cache: true

    - name: Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}/build

    - name: Set up Visual Studio shell
      uses: egor-tensin/vs-shell@v2
      with:
        arch: ${{ matrix.msvcarch }}

    - name: Configure CMake
      shell: cmd
      working-directory: ${{github.workspace}}/build
      run: |
        cmake .. -DCMAKE_BUILD_TYPE=Release -G Ninja

    - name: Build
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: cmake --build .

    - name: Upload executable artifact
      uses: actions/upload-artifact@v4
      with:
        name: Windows ${{ matrix.arch }} binary
        path: build/openkj.exe
